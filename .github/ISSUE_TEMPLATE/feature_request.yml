name: Feature request
description: Propose an improvement to Irori
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Alternatives considered?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: Irori is a single-operator homelab tool — check docs/SPEC.md non-goals first.
      options:
        - label: This is not a listed non-goal in docs/SPEC.md
