name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Self-hosted runner (LXC 110): GitHub-hosted build minutes are exhausted.
    # Postgres runs as a throwaway cluster started/stopped per job — no docker
    # on this runner, so no services: block.
    runs-on: iroiri-dev-vm
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable Postgres
        run: |
          INITDB=$(ls /usr/lib/postgresql/*/bin/initdb | sort -V | tail -1)
          PGDATA=$(mktemp -d /tmp/irori-pgdata.XXXXXX)
          "$INITDB" -D "$PGDATA" -U postgres --auth=trust -E utf8
          PGCTL=$(ls /usr/lib/postgresql/*/bin/pg_ctl | sort -V | tail -1)
          "$PGCTL" -D "$PGDATA" -o "-p 54329 -c listen_addresses=127.0.0.1" -l /tmp/irori-pg.log -w start
          echo "IRORI_TEST_DATABASE_URL=postgres://postgres@127.0.0.1:54329/postgres" >> "$GITHUB_ENV"
          echo "IRORI_PGDATA=$PGDATA" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: .agentic/bin/validate
      - run: .agentic/bin/docs-check
      - name: Stop disposable Postgres
        if: always()
        run: |
          if [ -n "${IRORI_PGDATA:-}" ]; then
            PGCTL=$(ls /usr/lib/postgresql/*/bin/pg_ctl | sort -V | tail -1)
            "$PGCTL" -D "$IRORI_PGDATA" stop -m immediate || true
            rm -rf "$IRORI_PGDATA" /tmp/irori-pg.log
          fi
