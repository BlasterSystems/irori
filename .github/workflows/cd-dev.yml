name: CD DEV

on:
  push:
    tags: ['dev-*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit/tag/branch to deploy (tests run against it first)'
        required: false
        default: main

concurrency:
  group: cd-dev
  cancel-in-progress: false

jobs:
  test:
    # Self-hosted runner (LXC 110): GitHub-hosted build minutes are exhausted.
    # Postgres runs as a throwaway cluster started/stopped per job — no docker
    # on this runner, so no services: block. Gates the deploy below.
    runs-on: iroiri-dev-vm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - name: Start disposable Postgres
        run: |
          INITDB=$(ls /usr/lib/postgresql/*/bin/initdb | sort -V | tail -1)
          PGDATA=$(mktemp -d /tmp/irori-pgdata.XXXXXX)
          "$INITDB" -D "$PGDATA" -U postgres --auth=trust -E utf8
          PGCTL=$(ls /usr/lib/postgresql/*/bin/pg_ctl | sort -V | tail -1)
          "$PGCTL" -D "$PGDATA" -o "-p 54329 -c listen_addresses=127.0.0.1" -l /tmp/irori-pg.log -w start
          echo "IRORI_TEST_DATABASE_URL=postgres://postgres@127.0.0.1:54329/postgres" >> "$GITHUB_ENV"
          echo "IRORI_PGDATA=$PGDATA" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Stop disposable Postgres
        if: always()
        run: |
          if [ -n "${IRORI_PGDATA:-}" ]; then
            PGCTL=$(ls /usr/lib/postgresql/*/bin/pg_ctl | sort -V | tail -1)
            "$PGCTL" -D "$IRORI_PGDATA" stop -m immediate || true
            rm -rf "$IRORI_PGDATA" /tmp/irori-pg.log
          fi

  deploy:
    needs: test
    runs-on: iroiri-dev-vm
    environment: development
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the git bundle must contain all parent objects.
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Create git bundle
        run: git bundle create /tmp/irori-dev.bundle HEAD

      - name: Deploy over SSH to the docker VM
        env:
          SSH_KEY: ${{ secrets.DEV_VM_SSH_KEY }}
          VM_HOST: ${{ vars.DEV_VM_HOST }}
          VM_USER: ${{ vars.DEV_VM_USER }}
          VM_DEPLOY_DIR: ${{ vars.DEV_DEPLOY_DIR }}
          GIT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "$SSH_KEY" > /tmp/deploy_key
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new $VM_USER@$VM_HOST"

          scp -q -i /tmp/deploy_key /tmp/irori-dev.bundle "$VM_USER@$VM_HOST:/tmp/irori-dev.bundle"

          # Idempotent bootstrap: the VM repo may be unborn on first deploy.
          $SSH "mkdir -p '$VM_DEPLOY_DIR' && test -d '$VM_DEPLOY_DIR/.git' || git init -q '$VM_DEPLOY_DIR'"

          # Fetch the exact commit and detach; NEVER checkout a ref name (stale).
          $SSH "cd '$VM_DEPLOY_DIR' && git fetch --force /tmp/irori-dev.bundle HEAD && git checkout --detach --force FETCH_HEAD && git clean -ffdxq -e deploy/.env"

          # Build on the VM (no GitHub credentials live here). PREV must be
          # captured BEFORE the build — compose retags irori-dev:latest to the
          # new image, so capturing after would "roll back" to the broken one.
          $SSH "cd '$VM_DEPLOY_DIR' && PREV=\$(docker images --format '{{.ID}}' irori-dev:latest | head -1); echo \"\$PREV\" > /tmp/irori-dev.prev"
          $SSH "cd '$VM_DEPLOY_DIR' && IRORI_GIT_TAG='$GIT_TAG' docker compose -f deploy/docker-compose.yml build --pull irori"

          $SSH "cd '$VM_DEPLOY_DIR' && docker rm -f irori-dev 2>/dev/null || true; docker compose -f deploy/docker-compose.yml up -d --no-deps irori"

          # Health gate: 60 x 2s against /healthz inside the container (PORT 3947).
          if ! $SSH "cd '$VM_DEPLOY_DIR' && for i in \$(seq 1 60); do docker compose -f deploy/docker-compose.yml exec -T irori node -e \"fetch('http://127.0.0.1:3947/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\" && exit 0; sleep 2; done; exit 1"; then
            echo "Health gate failed — rolling back to previous image"
            $SSH "cd '$VM_DEPLOY_DIR' && PREV=\$(cat /tmp/irori-dev.prev); if [ -n \"\$PREV\" ]; then docker tag \"\$PREV\" irori-dev:latest && docker compose -f deploy/docker-compose.yml up -d --no-deps irori; fi"
            exit 1
          fi
          echo "Deploy healthy on :3947"

      - name: Cleanup
        if: always()
        run: rm -f /tmp/deploy_key /tmp/irori-dev.bundle
