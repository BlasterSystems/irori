name: Release

# M7 packaging (SPEC §11): on a v* tag, build multi-arch images for the
# server and agent roles, push them to GHCR, and attach the agent bundle +
# install script + systemd unit to the GitHub release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Server image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      - name: Agent image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-agent:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-agent:latest

  agent-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the agent bundle
        run: pnpm --filter @irori/agent build

      - name: Stage release artifacts
        run: |
          mkdir -p dist-release
          cp apps/agent/dist/irori-agent.mjs dist-release/irori-agent.mjs
          cp apps/agent/install-agent.sh dist-release/install-agent.sh
          cp apps/agent/irori-agent.service dist-release/irori-agent.service
          sha256sum dist-release/* > dist-release/SHA256SUMS

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/irori-agent.mjs
            dist-release/install-agent.sh
            dist-release/irori-agent.service
            dist-release/SHA256SUMS
