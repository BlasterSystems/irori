name: Release

# M7 packaging (SPEC §11): on a v* tag, build multi-arch images for the
# server and agent roles, push them to GHCR, and attach the agent bundle +
# install script + systemd unit to the GitHub release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    # IRI-051-era: GitHub-hosted minutes are exhausted — the release builds on
    # the self-hosted runner (LXC 110, docker + buildx installed 2026-10-31).
    # amd64 only: the hub runs on x86, agents consume the arch-independent
    # bundle via the hub, and no arm64 consumer exists (re-add platforms +
    # setup-qemu if an arm64 deployment target appears).
    runs-on: iroiri-dev-vm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Server image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: server
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_TAG=${{ github.ref_name }}
          tags: |
            ghcr.io/blastersystems/irori:${{ github.ref_name }}
            ghcr.io/blastersystems/irori:latest

      - name: Agent image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: agent
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/blastersystems/irori-agent:${{ github.ref_name }}
            ghcr.io/blastersystems/irori-agent:latest

  agent-artifacts:
    # Self-hosted runner (LXC 110) — same toolchain as the CI verify job.
    runs-on: iroiri-dev-vm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # esbuild resolves @irori/core through the workspace symlink to its
      # dist/ — the core build must precede the agent bundle build.
      - run: pnpm -r build

      - name: Build the agent bundle
        run: pnpm --filter @irori/agent build

      - name: Stage release artifacts
        run: |
          mkdir -p dist-release
          cp apps/agent/dist/irori-agent.mjs dist-release/irori-agent.mjs
          cp apps/agent/install-agent.sh dist-release/install-agent.sh
          cp apps/agent/irori-agent.service dist-release/irori-agent.service
          sha256sum dist-release/* > dist-release/SHA256SUMS

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/irori-agent.mjs
            dist-release/install-agent.sh
            dist-release/irori-agent.service
            dist-release/SHA256SUMS
