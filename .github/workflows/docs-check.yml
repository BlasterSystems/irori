name: docs-check

on:
  pull_request:
  workflow_dispatch:


permissions:
  contents: read

jobs:
  docs-check:
    # Self-hosted runner (LXC 110): GitHub-hosted build minutes are exhausted.
    runs-on: iroiri-dev-vm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate generated project configuration
        run: .agentic/bin/validate
      - name: Check documentation coverage
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          BASE="${PR_BASE_SHA:-origin/${DEFAULT_BRANCH}}"
          .agentic/bin/docs-check --base "$BASE" --strict
